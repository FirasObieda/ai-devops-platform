name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite://

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest

      - name: Install security tools
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

  ai-review:
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64, ai-devops]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Ollama
        run: |
          echo "Ollama version:"
          ollama --version

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run AI code review
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          changedFiles=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" | grep -E '\.py$' || true)

          if [ -z "$changedFiles" ]; then
            echo "No Python files changed. Skipping AI review."
            exit 0
          fi

          echo "Python files changed in this push:"
          echo "$changedFiles"

          echo "Generating Python diff..."

          git diff "$BEFORE_SHA" "$AFTER_SHA" -- '*.py' \
            | python3 -m ai_reviewer.reviewer --diff

  docker-build:
    needs:
      - quality
      - ai-review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Docker image
        run: docker build -t ai-devops-platform:${{ github.sha }} .

  deploy:
    needs:
      - quality
      - ai-review
      - docker-build
    runs-on: [self-hosted, Linux, X64, ai-devops]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy application
        run: |
          docker compose down
          docker compose up -d --build

      - name: Wait for application
        run: sleep 10

      - name: Health check
        run: |
          curl --fail http://localhost:8000/health
