name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite://

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest

      - name: Install security tools
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

  ai-review:
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64, ai-devops]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Ollama
        run: |
          echo "Ollama version:"
          ollama --version

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run AI code review
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          changedFiles=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" | grep -E '\.py$' || true)

          if [ -z "$changedFiles" ]; then
            echo "No Python files changed. Skipping AI review."
            exit 0
          fi

          echo "Python files changed in this push:"
          echo "$changedFiles"

          echo "Generating Python diff..."

          git diff "$BEFORE_SHA" "$AFTER_SHA" -- '*.py' \
            | python3 -m ai_reviewer.reviewer --diff

  docker-build:
    if: github.event_name == 'push'
    needs:
      - quality
      - ai-review
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/firasobieda/ai-devops-platform:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push \
            ghcr.io/firasobieda/ai-devops-platform:${{ github.sha }}

  deploy:
    if: github.event_name == 'push'
    needs:
      - quality
      - ai-review
      - docker-build
    runs-on: [self-hosted, Linux, X64, ai-devops]

    permissions:
      contents: read
      packages: read

    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      IMAGE_NAME: ghcr.io/firasobieda/ai-devops-platform:${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect currently deployed image
        id: current-image
        run: |
          currentImage=$(docker inspect \
            --format='{{.Config.Image}}' \
            ai-devops-platform-api-1 2>/dev/null || true)

          if [ -n "$currentImage" ]; then
            echo "Current deployed image: $currentImage"
            echo "rollbackImage=$currentImage" >> "$GITHUB_OUTPUT"
          else
            echo "No currently deployed application container found."
            echo "rollbackImage=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull application image
        run: |
          docker pull "$IMAGE_NAME"

      - name: Deploy application
        run: |
          docker compose up -d

      - name: Health check
        run: |
          for i in {1..12}; do
            if curl --fail http://localhost:8000/health; then
              echo "Application is healthy."
              exit 0
            fi

            echo "Health check failed. Retrying in 5 seconds..."
            sleep 5
          done

          echo "Application failed health check."
          exit 1

      - name: Roll back deployment
        if: failure()
        env:
          ROLLBACK_IMAGE: ${{ steps.current-image.outputs.rollbackImage }}
        run: |
          echo "Deployment failed. Starting rollback..."

          if [ -n "$ROLLBACK_IMAGE" ]; then
            echo "Rolling back to: $ROLLBACK_IMAGE"

            docker pull "$ROLLBACK_IMAGE"

            docker compose down

            export IMAGE_NAME="$ROLLBACK_IMAGE"
            docker compose up -d

            echo "Previous version restored."

            for i in {1..12}; do
              if curl --fail http://localhost:8000/health; then
                echo "Rollback successful."
                exit 0
              fi

              echo "Rollback health check failed. Retrying in 5 seconds..."
              sleep 5
            done

            echo "Rollback failed."
            exit 1
          else
            echo "No previous image available. Rollback skipped."
            exit 1
          fi
