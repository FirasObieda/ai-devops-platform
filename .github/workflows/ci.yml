name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite://

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest

      - name: Install security tools
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

  ai-review:
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64, ai-devops]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Ollama
        run: |
          echo "Ollama version:"
          ollama --version

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run AI code review
        run: |
          changedFiles=$(git diff --name-only HEAD~1 HEAD | grep -E '\.py$' || true)

          if [ -z "$changedFiles" ]; then
            echo "No Python files changed. Skipping AI review."
            exit 0
          fi

          echo "Python files to review:"
          echo "$changedFiles"

          python3 -m ai_reviewer.reviewer $changedFiles
